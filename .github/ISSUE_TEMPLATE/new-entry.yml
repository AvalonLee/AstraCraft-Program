name: 建议收录新条目
description: 推荐一个你认为不错的 GitHub 公开开源 Skill 或关联项目（仅限 GitHub 开源，闭源/私有不予收录）
title: "[收录] <项目名称>"
labels: ["收录建议"]
body:
  - type: input
    id: name
    attributes:
      label: 项目名称
      description: 上游仓库或项目的名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: GitHub 公开仓库地址
      description: 仅接受 GitHub 公开开源仓库；不接受私有/闭源/其他平台
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      options:
        - writing-docs（写作与文档）
        - dev-engineering（研发与代码）
        - design-creative（设计与创意）
        - data-analytics（数据与分析）
        - research-intel（研究与信息获取）
        - ops-automation（运维与自动化）
        - business-office（商业与办公）
        - agent-infra（Agent 基础设施）
        - meta-skillcraft（技能工程）
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证
      description: 例如 MIT / Apache-2.0 / CC-BY-4.0；不确定就填「未知」
      placeholder: MIT
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么值得收录
      description: 它解决什么问题、有什么亮点、你实测过吗？
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自检
      options:
        - label: 我确认这是 GitHub 公开开源仓库（非私有/闭源），来源可溯、文档可用，且能写清安装指令
          required: true
