name: index-check
# 注意：本 workflow 按路径触发（SKILL.md / scripts / site / INDEX.md 等），
# 纯历史归位类 PR 不触发这些检查，会让必需检查一直停在 expected 而无法合并。
# 2026-10-28 回流说明：PR #60 已把批次1+2 发往 main（261028d）。
# 2026-10-29 回流说明：PR #65 已把三个新条目发往 main（261029c）。
# 2026-10-29 回流说明：PR #69 已把六条目批次与核验快照发往 main（261029e）。

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/ENTRY.md'
      - 'SKILL.md'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'verification/**'
      - 'INDEX.md'
      - '.github/workflows/index-check.yml'
      - '.github/workflows/upstream-refresh.yml'

permissions:
  contents: read

jobs:
  tests:
    name: 离线测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt
      - run: pytest -q

  validate:
    name: 校验元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 运行 validate.py
        run: python scripts/validate.py

  index-drift:
    name: 检查 INDEX.md 是否脱节
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 比对 INDEX.md
        run: python scripts/gen_index.py --check

  site-gen:
    name: 检查站点生成器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 运行 gen_site.py
        run: python scripts/gen_site.py --check --quiet
