name: index-check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/meta.yml'
      - '**/upstream.lock'
      - '**/README.zh-CN.md'
      - '**/NOTES.zh-CN.md'
      - 'scripts/**'
      - 'INDEX.md'
      - '.github/workflows/index-check.yml'

permissions:
  contents: read

jobs:
  validate:
    name: 校验元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 运行 validate.py
        run: python scripts/validate.py

  index-drift:
    name: 检查 INDEX.md 是否脱节
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 比对 INDEX.md
        run: python scripts/gen_index.py --check
