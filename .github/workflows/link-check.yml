name: link-check

on:
  pull_request:
  schedule:
    # 每周一 06:00 UTC 全量扫描一次
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR 增量：检查 Markdown 死链（基于 tcort 维护版 markdown-link-check）
  pr-links:
    if: github.event_name == 'pull_request'
    name: PR Markdown 死链检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Markdown Link Check
        uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: 'mlc_config.json'
          # 默认扫描仓库内全部 .md；如需只看改动文件可在 args 里指定路径
          args: -c mlc_config.json

  # 每周全量：基于 lychee 扫描全部 Markdown
  weekly-full:
    if: github.event_name != 'pull_request'
    name: 每周全量死链扫描
    runs-on: ubuntu-latest
    continue-on-error: true   # 全量扫描对瞬断网络容忍，结果仅供参考
    steps:
      - uses: actions/checkout@v5
      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-file .lycheeignore --timeout 20 './**/*.md'
          fail: false
