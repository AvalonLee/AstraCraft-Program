# ============================================================================
# SkillMall 条目元数据
# ----------------------------------------------------------------------------
# 本文件由人工维护，记录条目的语义信息。
# 与之配套的 upstream.lock 由脚本维护，记录同步状态，请勿手改。
#
# 字段完整定义见 scripts/schema/meta.schema.json
# 填完后跑一遍：python scripts/validate.py
# ============================================================================

# ── 身份 ────────────────────────────────────────────────────────────────────
# id 必须等于所在目录名，小写字母/数字/连字符，全局唯一
id: your-entry-id
name_zh: 中文名称
name_en: English Name

# 一句话简介，≤200 字符，会直接出现在 INDEX 表格里，写得具体一点
summary_zh: 它解决什么问题、适合谁用。避免"强大的""优秀的"这类空话。
summary_en: What problem it solves and who it is for.

# ── 分类与标签 ──────────────────────────────────────────────────────────────
# category 必须与所在的一级目录名一致，九选一：
#   writing-docs | dev-engineering | design-creative | data-analytics
#   research-intel | ops-automation | business-office | agent-infra
#   meta-skillcraft
category: meta-skillcraft

# kind 六选一：skill | skill-collection | mcp-server | cli-tool | framework | spec
kind: skill

# 交叉检索用。建议 3-6 个，中英文混用没关系，但同一概念在全仓要统一写法
tags: [标签一, 标签二, claude-code]

# 实现语言（小写）。纯文档类填 [markdown]
languages: [markdown]

# 上游文档提供的语言，ISO 639-1
doc_languages: [en]

# ── 许可证（最重要，填错会被 CI 拦下）────────────────────────────────────────
# license: SPDX 标识符，或 UNKNOWN / LicenseRef-xxx
# license_tier:
#   A = 绿灯，可直接 vendoring（MIT/BSD/ISC/0BSD/Unlicense/CC0/CC-BY-4.0）
#   B = 黄灯，可 vendoring 但需带 NOTICE 且零修改（Apache-2.0/MPL-2.0/OFL-1.1）
#   C = 红灯，禁止拷贝源码，只能做 link-only 存根
#       （GPL 系 / SSPL / BUSL / NC / ND / source-available / 无 LICENSE / 声明冲突）
# 判定流程见 docs/license-policy.md
license: MIT
license_tier: A
license_file: src/LICENSE          # 相对条目目录；link-only 时留空或删除

# 从上游 LICENSE 文件里抄，不要凭印象填
copyright_holder: Upstream Author Name

# ── Vendoring ───────────────────────────────────────────────────────────────
vendoring:
  mode: full                       # full | link-only
  path: src/                       # mode: full 时必填；link-only 时删掉本行

# ── 链接 ────────────────────────────────────────────────────────────────────
homepage: https://github.com/OWNER/REPO
repo: https://github.com/OWNER/REPO
# docs_url: https://example.com/docs    # 可选

# ── 指标（由 scripts/sync_metrics.py 自动回写，不要手填）────────────────────
metrics:
  stars: null
  pushed_at: null
  checked_at: null
  archived: false

# ── 收录评级 ────────────────────────────────────────────────────────────────
# tier:
#   core     主推条目。必须有非空 NOTES.zh-CN.md（CI 强制），建议满足 ≥3 项加分项
#   standard 常规收录
#   watch    观察期。存疑、待验证、或上游已归档但有史料价值
#
# checked: 已验证通过的硬门槛编号
#   H1 可获取 / H2 协议明确 / H3 文档可用 / H4 活跃度 / H5 真实可用
#   只填你真正验证过的，别凑数
#
# exception: 破例理由。仅 H4（活跃度）可破例，H1/H2/H3 是底线不可破。
#   非空时 INDEX 会标 ★
admission:
  tier: standard
  checked: [H1, H2, H3, H4, H5]
  exception: null

# ── 时间 ────────────────────────────────────────────────────────────────────
added_at: "2026-08-10"
updated_at: "2026-08-10"

# ── 关系 ────────────────────────────────────────────────────────────────────
# related: 关联条目的 id，会在 INDEX 生成交叉链接
related: []

# aliases: 上游曾用名、改名前的名字、常见别称。
#          这是去重检测的关键字段，认真填能避免同一项目被重复收录
aliases: []

# ── 风险备注 ────────────────────────────────────────────────────────────────
# 已知问题写在这里，会在 INDEX 中以 ⚠️ 提示。没有就填 null
risk_notes: null
