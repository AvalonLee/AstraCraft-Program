# ============================================================================
# 上游同步状态锁文件
# ----------------------------------------------------------------------------
# ⚠️ 本文件由 scripts/vendor.py 自动写入，请勿手动编辑。
#    手改会导致 content_hash 校验失配，vendor.py --verify 会报错。
#
# 生成方式：
#   python scripts/vendor.py --add <url> --into <分类>/<id>
# 校验方式：
#   python scripts/vendor.py --verify
# ============================================================================

source_url: https://github.com/OWNER/REPO
source_type: github          # github | gitlab | website | manual
ref: main                    # 分支名或 tag
commit: null                 # 完整 40 位 SHA，用于精确追溯上游版本
commit_date: null            # 上游该 commit 的提交时间（ISO 8601）
synced_at: null              # 本仓库执行拷贝的时间
synced_by: null              # 执行拷贝的脚本与版本
subpath: "."                 # 只取上游子目录时填相对路径，取全仓填 "."
file_count: 0
total_bytes: 0

# src/ 下全部文件按路径排序后的内容哈希。
# 用于检测 vendored 内容是否被本地误改——vendoring 必须零修改。
content_hash: null

# 拷贝时剔除的路径（glob）
excluded:
  - .git/
  - .github/workflows/
  - node_modules/
  - __pycache__/

# 必须保持为空数组。
# 一旦对上游文件做了任何修改，Apache-2.0 等协议会要求逐文件标注改动，
# 本仓库通过「零修改」策略规避该义务。需要补充说明请写进 NOTES.zh-CN.md。
local_patches: []
