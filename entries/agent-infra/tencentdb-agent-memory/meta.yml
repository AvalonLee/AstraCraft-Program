risk_notes: 默认分支为迭代中的 feat/server_team（非主干命名）；assets 中的演示视频与 6 张流程图大图因体积上限未随快照收录（见 src/assets/FETCH.md）；README 安装段示例把仓库写成 Tencent/TencentDB-Agent-Memory，实际为 TencentCloud/TencentDB-Agent-Memory。
