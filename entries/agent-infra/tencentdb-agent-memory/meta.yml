# ============================================================================
# SkillMall 条目元数据
# ----------------------------------------------------------------------------
# 本文件由人工维护，记录条目的语义信息。
# 与之配套的 upstream.lock 由脚本维护，记录同步状态，请勿手改。
#
# 字段完整定义见 scripts/schema/meta.schema.json
# 填完后跑一遍：python scripts/validate.py
# ============================================================================

# ── 身份 ────────────────────────────────────────────────────────────────────
# id 必须等于所在目录名，小写字母/数字/连字符，全局唯一
id: tencentdb-agent-memory
name_zh: TencentDB Agent Memory
name_en: TencentDB Agent Memory

# 一句话简介，≤200 字符，会直接出现在 INDEX 表格里，写得具体一点
summary_zh: 腾讯云出品的 Agent 团队级记忆中心（Memory Hub）：把对话、文档与代码沉淀为 Chat Memory / Skill / LLM-Wiki / CodeGraph 四类可复用资产，支持治理、共享并跨 Agent 与框架装备，让经验在团队中流动。
summary_en: "Team memory hub for AI agents: turns conversations, docs and code into reusable assets (Chat Memory, Skill, LLM-Wiki, CodeGraph), shared across agents and frameworks."

# ── 分类与标签 ──────────────────────────────────────────────────────────────
# category 必须与所在的一级目录名一致，九选一：
#   writing-docs | dev-engineering | design-creative | data-analytics
#   research-intel | ops-automation | business-office | agent-infra
#   meta-skillcraft
category: agent-infra

# kind 六选一：skill | skill-collection | mcp-server | cli-tool | framework | spec
kind: framework

# 交叉检索用。建议 3-6 个，中英文混用没关系，但同一概念在全仓要统一写法
tags: [memory, agent, long-term-memory, skill, llm-wiki, code-graph, claude-code, openclaw, vector-search, tencent]

# 实现语言（小写）。纯文档类填 [markdown]
languages: [typescript]

# 上游文档提供的语言，ISO 639-1
doc_languages: [zh, en]

# ── 许可证（最重要，填错会被 CI 拦下）────────────────────────────────────────
# license: SPDX 标识符，或 UNKNOWN / LicenseRef-xxx
# license_tier:
#   A = 绿灯，可直接 vendoring（MIT/BSD/ISC/0BSD/Unlicense/CC0/CC-BY-4.0）
#   B = 黄灯，可 vendoring 但需带 NOTICE 且零修改（Apache-2.0/MPL-2.0/OFL-1.1）
#   C = 红灯，禁止拷贝源码，只能做 link-only 存根
license: MIT
license_tier: A
license_file: src/LICENSE          # 相对条目目录；link-only 时留空或删除

# 从上游 LICENSE 文件里抄，不要凭印象填
copyright_holder: Tencent

# ── Vendoring ───────────────────────────────────────────────────────────────
vendoring:
  mode: full                       # full | link-only
  path: src/                       # mode: full 时必填；link-only 时删掉本行

# ── 链接 ────────────────────────────────────────────────────────────────────
homepage: https://github.com/TencentCloud/TencentDB-Agent-Memory
repo: https://github.com/TencentCloud/TencentDB-Agent-Memory

# ── 指标（由 scripts/sync_metrics.py 自动回写，不要手填）────────────────────
metrics:
  stars: 21060
  pushed_at: "2026-08-11T12:12:06Z"
  checked_at: "2026-08-13"
  archived: false

# ── 收录评级 ────────────────────────────────────────────────────────────────
# tier:
#   core     主推条目。必须有非空 NOTES.zh-CN.md（CI 强制），建议满足 ≥3 项加分项
#   standard 常规收录
#   watch    观察期。存疑、待验证、或上游已归档但有史料价值
#
# checked: 已验证通过的硬门槛编号
#   H1 可获取 / H2 协议明确 / H3 文档可用 / H4 活跃度 / H5 真实可用
#   只填你真正验证过的，别凑数
admission:
  tier: standard
  checked: [H1, H2, H3, H4]
  exception: null

# ── 时间 ────────────────────────────────────────────────────────────────────
added_at: "2026-08-13"
updated_at: "2026-08-13"

# ── 关系 ────────────────────────────────────────────────────────────────────
